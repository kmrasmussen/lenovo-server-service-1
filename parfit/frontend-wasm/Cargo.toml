[package]
name = "parfit-frontend-wasm"
description = "rustwasm for browser client for temporally fine-grained human AI collaboration"
license = "apache2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Request", "RequestInit", "RequestMode", "Response", "Headers", "Window", "console",
  "WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "../shared" }
console_error_panic_hook = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
hex = "0.4"
