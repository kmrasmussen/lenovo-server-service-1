[package]
name = "backend-ws"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features=["json", "multipart"]}
shared = { path = "../shared" }
gymbro = { path = "../apps/gymbro" }
